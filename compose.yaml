# LinkSink on Docker Compose (T-0005, ADR-0004): the app, and Caddy in front of it serving HTTPS only.
# Every setting comes from the .env beside this file; deploy/env.example lists each one. How to run it: deploy/README.md
# (this machine, built from the source) and deploy/SERVER.md (another machine: the published image, no source).
name: linksink

services:
  app:
    # The image CI publishes (T-0029). LINKSINK_IMAGE names another: a version (ghcr.io/laststep/linksink:1.2.0), a
    # commit (:sha-1a2b3c4), a digest (@sha256:...) or a fork's image. `docker compose up -d --build` builds it from
    # the source here under the same name; `docker compose pull` fetches it, and with no source here, `up` pulls it.
    image: ${LINKSINK_IMAGE:-ghcr.io/laststep/linksink:latest}
    build: .
    init: true
    restart: unless-stopped
    environment:
      # The public origin, from the one host name. The image carries none, so it serves any host.
      ORIGIN: https://${LINKSINK_HOST:-localhost}
      BETTER_AUTH_SECRET: ${LINKSINK_AUTH_SECRET:-}
      MAIL_TRANSPORT: ${LINKSINK_MAIL_TRANSPORT:-}
      RESEND_API_KEY: ${LINKSINK_RESEND_API_KEY:-}
      MAIL_FROM: ${LINKSINK_MAIL_FROM:-}
      # The client's address is the one Caddy writes into X-Forwarded-For; the sign-in rate limit keys on it.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    volumes:
      - data:/data
    # On the compose network only: published nowhere, so only Caddy reaches it.
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  caddy:
    # Pinned by its digest (the multi-platform index), so every machine runs the same Caddy; the tag is for people.
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # The only published ports. With LINKSINK_LISTEN set, on that address only; else on every address. Plain http
    # (it only redirects) on LINKSINK_HTTP_PORT, 80 unless set; HTTPS always on 443, so the origin carries no port.
    ports:
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}${LINKSINK_HTTP_PORT:-80}:80'
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}443:443'
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}443:443/udp'
    environment:
      LINKSINK_HOST: ${LINKSINK_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # The database (linksink.db) and the media cache (media/).
  data:
  # Caddy's certificates and keys, its local authority's root among them.
  caddy_data:
  caddy_config:
