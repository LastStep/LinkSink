# LinkSink on Docker Compose (T-0005, ADR-0004): the app, and Caddy in front of it serving HTTPS only.
# Every setting comes from the .env beside this file; deploy/env.example lists each one. How to run it: deploy/README.md.
name: linksink

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      # The public origin, from the one host name. The image carries none, so it serves any host.
      ORIGIN: https://${LINKSINK_HOST:-localhost}
      BETTER_AUTH_SECRET: ${LINKSINK_AUTH_SECRET:-}
      MAIL_TRANSPORT: ${LINKSINK_MAIL_TRANSPORT:-}
      RESEND_API_KEY: ${LINKSINK_RESEND_API_KEY:-}
      MAIL_FROM: ${LINKSINK_MAIL_FROM:-}
      # The client's address is the one Caddy writes into X-Forwarded-For; the sign-in rate limit keys on it.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    volumes:
      - data:/data
    # On the compose network only: published nowhere, so only Caddy reaches it.
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # The only published ports. With LINKSINK_LISTEN set, on that address only; else on every address.
    ports:
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}80:80'
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}443:443'
      - '${LINKSINK_LISTEN:+${LINKSINK_LISTEN}:}443:443/udp'
    environment:
      LINKSINK_HOST: ${LINKSINK_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # The database (linksink.db) and the media cache (media/).
  data:
  # Caddy's certificates and keys, its local authority's root among them.
  caddy_data:
  caddy_config:
